name: Breakout scan

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 00:30 Israel (winter), after the US close
  workflow_dispatch:          # the "הרץ סריקה עכשיו" button on scan.html opens this

permissions:
  contents: write

concurrency:
  group: breakout-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add scan.json universe.json ohlc
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Breakout scan $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
