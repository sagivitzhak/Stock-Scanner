name: Update dashboard data

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 14:00 Israel in winter (15:00 in summer), Mon–Fri
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python update_data.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data.js ai_cache.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update dashboard data $(date -u +%Y-%m-%d)"
          git push
